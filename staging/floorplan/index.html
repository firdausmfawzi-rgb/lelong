<!doctype html>
<html lang="ms">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eden Floorplan Designer</title>
<meta name="description" content="Lukis pelan lantai: saiz rumah, dinding, pintu, tingkap dan perabot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eceff4; --card:#ffffff; --ink:#14213d; --ink2:#53617f; --line:#d3d9e5;
  --accent:#f2b705; --accent-ink:#14213d; --warn:#8a5d00; --danger:#b3261e;
  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#0e1522; --card:#151f31; --ink:#e8edf7; --ink2:#9eabc6; --line:#27344d; --warn:#f2b705; --danger:#ff8a80; color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
button,input,select{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{font:700 13px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);flex:0 0 100%}
.name{flex:1 1 220px;min-width:0;font:700 24px/1.1 var(--f-disp);letter-spacing:.02em;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.actions{display:flex;gap:8px;align-items:center}
.status{flex:1 0 100%;font-size:13px;color:var(--ink2);padding-inline:2px}
.status{min-height:18px}
.status.dirty{color:var(--warn);font-weight:600}
.btn{min-height:42px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{width:42px;padding:0;display:grid;place-items:center}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.warn-o{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn.wide{width:100%}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
:is(.btn,.chip,input,select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.main{grid-template-columns:minmax(0,1fr) 350px;align-items:start}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
@media (min-width:980px){.stage{position:sticky;top:10px}}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.tools .sep{flex:1 1 8px}
.tools select{width:auto;min-height:36px;font-size:13px;font-weight:600}
.sheet{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;height:min(72vh,780px);min-height:380px}
.sheet.drop{outline:3px solid var(--accent);outline-offset:-3px}
#plan{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;touch-action:none;background:#fff}
#plan .it{cursor:move}
#plan.t-draw,#plan.t-draw .it{cursor:crosshair}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:10px 2px 0;font-size:13px;color:var(--ink2)}
.foot .mono{font-size:12.5px;color:var(--ink)}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h2{margin:0 0 4px;font:700 12px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.card .sub{margin:0 0 12px;font-size:13px;color:var(--ink2)}
.grp{margin-top:12px}
.grp h3{margin:0 0 6px;font:600 13px var(--f-ui);color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{min-height:74px;padding:6px 4px 5px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.chip:hover{border-color:var(--ink2)}
.chip .ic{flex:1;display:grid;place-items:center;background:#fff;border-radius:4px;width:100%;padding:3px}
.chip svg{display:block;max-width:100%;height:30px}
.chip .cl{font:600 12px/1.1 var(--f-ui);text-align:center}
.chip .cs{font:500 9.5px/1 var(--f-mono);color:var(--ink2)}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);padding:8px 14px;border:2px solid var(--ink);border-radius:6px;background:var(--accent);font:700 16px/1 var(--f-ui);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.25)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fld{display:block;margin-bottom:8px}
.row2 .fld{margin-bottom:0}
.fld span{display:block;margin-bottom:4px;font:600 12px var(--f-ui);color:var(--ink2)}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px}
.chk input{width:20px;height:20px}
input[type=text],input[type=number],select{width:100%;min-width:0;min-height:42px;padding:0 10px;font-size:16px;font-weight:500;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px}
.area{margin:2px 0 10px;font-size:13px;color:var(--ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.hint{margin:0;font-size:13px;color:var(--ink2)}
.plans{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.plans li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.plans li.cur{border-color:var(--accent)}
.plans .pi{flex:1;min-width:0}
.plans .pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plans .pm{font-size:12px;color:var(--ink2)}
.empty-plans{margin:10px 0 0;font-size:13px;color:var(--ink2)}
@media (max-width:979px){.c-insp.empty{display:none}}
</style>
</head>
<body>
<div style="position:fixed;left:8px;bottom:8px;z-index:9999;background:#c62828;color:#fff;font:700 12px/1 system-ui,sans-serif;padding:6px 10px;border-radius:999px;pointer-events:none">STAGING · ujian, bukan laman live</div>
<div class="wrap">
  <header class="top">
    <div class="brand">Eden Floorplan Designer</div>
    <input id="plan-name" class="name" type="text" maxlength="60" placeholder="Nama pelan, cth. TYPE B1" aria-label="Nama pelan" autocomplete="off">
    <div class="actions">
      <button id="b-undo" class="btn icon" type="button" aria-label="Buat asal" title="Buat asal (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button id="b-redo" class="btn icon" type="button" aria-label="Ulang semula" title="Ulang semula (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
      </button>
      <button id="b-save" class="btn primary" type="button">Simpan</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </header>

  <div class="main">
    <section class="stage" aria-label="Pelan lantai">
      <div class="tools" id="tools">
        <button class="btn sm" type="button" data-tool="select">Pilih</button>
        <button class="btn sm" type="button" data-tool="wall">Dinding</button>
        <button class="btn sm" type="button" data-tool="room">Lantai bilik</button>
        <button class="btn sm" type="button" data-tool="door">Pintu</button>
        <button class="btn sm" type="button" data-tool="window">Tingkap</button>
        <select id="wall-t" aria-label="Tebal dinding baharu" title="Tebal dinding baharu"></select>
        <span class="sep"></span>
        <button id="z-out" class="btn sm icon" type="button" aria-label="Zum keluar" style="width:36px">−</button>
        <button id="z-in" class="btn sm icon" type="button" aria-label="Zum masuk" style="width:36px">+</button>
        <button id="z-fit" class="btn sm" type="button">Muat</button>
        <button id="b-grid" class="btn sm on" type="button">Grid</button>
      </div>
      <div id="sheet" class="sheet">
        <svg id="plan" role="img" aria-label="Pelan lantai" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" font-family="Arial,Helvetica,sans-serif"></svg>
      </div>
      <div class="foot">
        <span id="hint"></span>
        <span id="total" class="mono"></span>
      </div>
    </section>

    <aside class="side">
      <section id="insp" class="card c-insp empty">
        <h2 id="insp-title">Item dipilih</h2>
        <div id="insp-body"></div>
      </section>

      <section class="card">
        <h2>Saiz rumah</h2>
        <p class="sub">Ukuran luar rumah dalam milimeter. Ia dipaparkan pada garisan dimensi di atas dan kiri pelan.</p>
        <div class="row2">
          <label class="fld"><span>Lebar (mm)</span><input id="u-w" type="number" inputmode="numeric" step="50" min="1000" max="60000"></label>
          <label class="fld"><span>Panjang (mm)</span><input id="u-h" type="number" inputmode="numeric" step="50" min="1000" max="60000"></label>
        </div>
        <div id="h-dims" class="area mono"></div>
        <div class="row2">
          <label class="fld"><span>Luas pada tajuk (sq ft)</span><input id="h-sf" type="number" inputmode="numeric" step="1" min="0" max="20000"></label>
          <label class="fld"><span>Sari kata tajuk</span><input id="h-sub" type="text" maxlength="40" autocomplete="off"></label>
        </div>
        <div class="btnrow">
          <button id="h-est" class="btn sm" type="button" title="Kira lebar dan panjang daripada luas sq ft">Anggar ukuran dari sq ft</button>
          <button id="h-walls" class="btn sm" type="button">Bina dinding luar</button>
        </div>
      </section>

      <section class="card">
        <h2>Perabot</h2>
        <p class="sub">Seret ke pelan, atau tekan sekali untuk letak di tengah. Saiz boleh diubah selepas diletak.</p>
        <div id="palette"></div>
      </section>

      <section class="card">
        <h2>Pelan</h2>
        <div class="btnrow" style="margin-top:10px">
          <button id="b-new" class="btn sm" type="button">Baharu</button>
          <button id="b-sample" class="btn sm" type="button">Contoh B1</button>
          <button id="b-png" class="btn sm" type="button">Muat turun PNG</button>
          <button id="b-exp" class="btn sm" type="button">Eksport fail</button>
          <button id="b-imp" class="btn sm" type="button">Import fail</button>
          <input id="f-imp" type="file" accept=".json,application/json" hidden>
        </div>
        <div id="plans-wrap"></div>
      </section>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };

/* ---------- constants (all plan units are millimetres) ---------- */
var INK = '#2a2726', TXT = '#3a3532', GS = '#9b9b9b', AC = '#f2b705', NAVY = '#14213d', SQFT = 92903.04;
var FILLS = {peach:['Pic','#f4dfd6'], beige:['Krim','#eae7dc'], blue:['Biru','#c2dcea'], yard:['Kelabu','#dedccf'], green:['Hijau','#dde9d3'], white:['Putih','#ffffff']};
var KINDS = {bilik:['Bilik tidur','peach'], ruang:['Ruang tamu / lain','beige'], air:['Bilik air','blue'], yard:['Yard / balkoni','yard'], luar:['Foyer / luar','white']};
var BEDC = {hijau:['Hijau','#cfe3d3','#9db79f'], biru:['Biru','#c7dbe6','#9fbccd'], kuning:['Kuning','#ecdcb6','#c8a55b'], oren:['Oren','#f3d3bd','#dfa57f'], ungu:['Ungu','#ddd6ea','#b4a8d2']};
var THICK = [[230,'Dinding luar 230'],[150,'Dinding 150'],[115,'Dinding dalam 115'],[60,'Sekatan nipis 60']];
var CAT = [
  ['Bilik tidur',[
    ['bed','Katil Single',910,1900],['bed','Super Single',1070,1900],['bed','Katil Queen',1520,1900],['bed','Katil King',1830,1900],
    ['wardrobe','Almari 2 pintu',1000,550],['wardrobe','Almari 3 pintu',1500,550],['desk','Meja belajar',1200,600],['chair','Kerusi',450,450],['side','Meja sisi',450,450]]],
  ['Ruang tamu & makan',[
    ['sofa','Sofa 2 tempat',1500,850],['sofa','Sofa 3 tempat',2100,850],['coffee','Meja kopi',1000,550],['tv','Kabinet TV',1600,400],
    ['dining','Meja makan 4',1200,1500],['dining','Meja makan 6',1800,1600]]],
  ['Dapur',[
    ['cabinet','Kabinet',1800,600],['hob','Dapur gas',600,550],['ksink','Sinki dapur',900,550],['fridge','Peti sejuk',700,700],['washer','Mesin basuh',600,600]]],
  ['Bilik air',[['wc','Tandas',400,700],['basin','Sinki',500,450],['shower','Shower',900,900]]],
  ['Lain-lain',[['text','Teks',0,0],['db','Kotak DB',100,450]]]
];
var HINTS = {
  select:'Seret item untuk alih. Seret ruang kosong untuk gerakkan pelan, roda tetikus atau cubit untuk zum.',
  wall:'Seret pada pelan untuk lukis dinding. Hujung dinding melekat pada dinding sedia ada.',
  room:'Seret satu segi empat untuk lantai bilik (warna dan label).',
  door:'Tekan pada mana-mana dinding untuk letak pintu.',
  window:'Tekan pada mana-mana dinding untuk letak tingkap.'
};

/* ---------- state ---------- */
var st = blank(), sel = null, tool = 'select', wallT = 150, grid = true;
var planId = null, dirty = false, savedAt = null, hist = [], fut = [];
var vb = {x:0, y:0, w:14000, h:10000}, fitted = true, px = 10, drag = null, ptrs = {}, pinch = null, cd = null, plansCache = [], draftTimer = null;
var svg = $('#plan'), sheet = $('#sheet'), pal = $('#palette');

function blank(){ return {name:'', sf:'', sub:'', W:10950, H:8850, rooms:[], walls:[], ops:[], furn:[]}; }
function uid(){ return 'i' + Math.random().toString(36).slice(2, 9); }
function snap(v){ return Math.round(v / 50) * 50; }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nf(n){ return Math.round(n).toLocaleString('en-US'); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function get(id){
  if (!id) return null;
  var ks = ['rooms','walls','ops','furn'];
  for (var a = 0; a < 4; a++){ var l = st[ks[a]]; for (var i = 0; i < l.length; i++) if (l[i].id === id) return {k:ks[a], o:l[i]}; }
  return null;
}
function wallById(id){ for (var i = 0; i < st.walls.length; i++) if (st.walls[i].id === id) return st.walls[i]; return null; }
function wl(w){ return Math.hypot(w.x2 - w.x1, w.y2 - w.y1); }
function snapshot(){ return JSON.stringify(st); }
function applySnap(s){ st = JSON.parse(s); if (!get(sel)) sel = null; }
function pushHist(prev){ hist.push(prev); if (hist.length > 80) hist.shift(); fut = []; }
function markDirty(){
  dirty = true;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(function(){ try{ localStorage.setItem('eden-fp2-draft', JSON.stringify({st:st, planId:planId})); }catch(_){} }, 400);
}
function mutate(fn){ var prev = snapshot(); fn(); pushHist(prev); markDirty(); renderAll(); }
function undo(){ if (!hist.length) return; fut.push(snapshot()); applySnap(hist.pop()); markDirty(); renderAll(); }
function redo(){ if (!fut.length) return; hist.push(snapshot()); applySnap(fut.pop()); markDirty(); renderAll(); }

/* ---------- geometry ---------- */
function nearWall(p, max){
  var best = null;
  st.walls.forEach(function(w){
    var L = wl(w); if (L < 1) return;
    var ux = (w.x2 - w.x1) / L, uy = (w.y2 - w.y1) / L;
    var t = clamp((p.x - w.x1) * ux + (p.y - w.y1) * uy, 0, L);
    var d = Math.hypot(p.x - (w.x1 + ux * t), p.y - (w.y1 + uy * t));
    if (d <= max && (!best || d < best.d)) best = {w:w, t:t, d:d};
  });
  return best;
}
function fitOp(o){
  var w = wallById(o.wall); if (!w) return;
  var L = wl(w);
  if (o.w > L) o.w = Math.max(100, Math.floor(L / 50) * 50);
  o.pos = clamp(snap(o.pos), o.w / 2, Math.max(o.w / 2, L - o.w / 2));
}
function snapPt(p, skip){
  var q = {x:snap(p.x), y:snap(p.y)}, tol = Math.max(120, 10 * px), bx = tol, by = tol;
  st.walls.forEach(function(w){
    if (w.id === skip) return;
    [[w.x1, w.y1], [w.x2, w.y2]].forEach(function(e){
      if (Math.abs(p.x - e[0]) < bx){ bx = Math.abs(p.x - e[0]); q.x = e[0]; }
      if (Math.abs(p.y - e[1]) < by){ by = Math.abs(p.y - e[1]); q.y = e[1]; }
    });
  });
  return q;
}
function bounds(){
  var b = {x1:0, y1:0, x2:st.W, y2:st.H};
  function ext(a, c, d, e){ b.x1 = Math.min(b.x1, a); b.y1 = Math.min(b.y1, c); b.x2 = Math.max(b.x2, d); b.y2 = Math.max(b.y2, e); }
  st.rooms.concat(st.furn).forEach(function(o){ ext(o.x, o.y, o.x + o.w, o.y + o.h); });
  st.walls.forEach(function(w){ var h = w.t / 2; ext(Math.min(w.x1, w.x2) - h, Math.min(w.y1, w.y2) - h, Math.max(w.x1, w.x2) + h, Math.max(w.y1, w.y2) + h); });
  return b;
}
function frame(){ var b = bounds(); return {x:b.x1 - 1900, y:b.y1 - 1700, w:b.x2 - b.x1 + 2500, h:b.y2 - b.y1 + 1700 + 2500, b:b}; }
function sizeText(f){
  var w = Math.max(200, String(f.text || '').length * f.size * 0.62), h = f.size * 1.3;
  if (f.rot % 2){ f.w = h; f.h = w; } else { f.w = w; f.h = h; }
}
function sfAuto(){ return Math.round(st.W * st.H / SQFT); }
function nBeds(){ return st.rooms.filter(function(r){ return r.kind === 'bilik'; }).length; }
function nBaths(){ return st.rooms.filter(function(r){ return r.kind === 'air' && r.label; }).length; }
function subText(){ return st.sub || (nBeds() ? nBeds() + ' Rooms Total' : ''); }

/* ---------- svg helpers ---------- */
function R(x, y, w, h, rx, fill, stroke, sw){
  return '<rect x="' + x + '" y="' + y + '" width="' + Math.max(w, 0) + '" height="' + Math.max(h, 0) + '"' + (rx ? ' rx="' + rx + '"' : '') +
    ' fill="' + (fill || 'none') + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="' + (sw || 12) + '"' : '') + '/>';
}
function Ln(x1, y1, x2, y2, stroke, sw){ return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>'; }
function Ci(cx, cy, r, fill, stroke, sw){ return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (fill || 'none') + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="' + sw + '"' : '') + '/>'; }
function El(cx, cy, rx, ry, fill, stroke, sw){ return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>'; }
function Tx(x, y, t, size, fill, anchor, weight, extra){
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + (weight || 700) + '" fill="' + fill + '" text-anchor="' + (anchor || 'middle') +
    '" dominant-baseline="central" pointer-events="none"' + (extra || '') + '>' + esc(t) + '</text>';
}

/* ---------- furniture symbols, drawn in local mm with the head/back at the top ---------- */
var DRAW = {
  bed:function(w, h, f){
    var c = BEDC[f.c] || BEDC.hijau, two = w >= 1300, s = '';
    s += R(0, 0, w, h, 50, '#f1e4d3', '#c9a78a', 24) + R(0, 0, w, 100, 40, '#8a6449');

/* ---------- wiring ---------- */
$('#tools').addEventListener('click', function(e){ var b = e.target.closest('[data-tool]'); if (b) setTool(b.getAttribute('data-tool')); });
$('#wall-t').innerHTML = THICK.map(function(t){ return '<option value="' + t[0] + '">' + t[1] + ' mm</option>'; }).join('');
$('#wall-t').value = String(wallT);
$('#wall-t').addEventListener('change', function(e){ wallT = +e.target.value; });
function zoomBtn(f){ var r = rectOf(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); }
$('#z-in').addEventListener('click', function(){ zoomBtn(1 / 1.3); });
$('#z-out').addEventListener('click', function(){ zoomBtn(1.3); });
$('#z-fit').addEventListener('click', fitView);
$('#b-grid').addEventListener('click', function(e){ grid = !grid; e.currentTarget.classList.toggle('on', grid); renderCanvas(); });
$('#b-undo').addEventListener('click', undo);
$('#b-redo').addEventListener('click', redo);
$('#b-save').addEventListener('click', save);
$('#b-png').addEventListener('click', exportPng);
$('#b-new').addEventListener('click', function(e){ guarded(e.currentTarget, newPlan); });
$('#b-sample').addEventListener('click', function(e){ guarded(e.currentTarget, function(){ load(sample()); }); });
$('#b-exp').addEventListener('click', function(){ download(new Blob([JSON.stringify({app:'eden-floorplan', v:2, st:st})], {type:'application/json'}), slug() + '.json'); });
$('#b-imp').addEventListener('click', function(){ $('#f-imp').click(); });
$('#f-imp').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var rdr = new FileReader();
  rdr.onload = function(){
    try{ var o = JSON.parse(rdr.result); if (!o.st || !Array.isArray(o.st.walls)) throw 0; load(o.st); markDirty(); renderStatus(); }
    catch(_){ $('#status').className = 'status dirty'; $('#status').textContent = 'Fail ini bukan fail pelan yang sah.'; }
  };
  rdr.readAsText(f); e.target.value = '';
});
$('#plan-name').addEventListener('input', function(e){ st.name = e.target.value; markDirty(); renderStatus(); renderCanvas(); });
['#u-w', '#u-h'].forEach(function(id){
  $(id).addEventListener('change', function(){
    var w = parseFloat($('#u-w').value), h = parseFloat($('#u-h').value);
    w = isNaN(w) ? st.W : clamp(Math.round(w), 1000, 60000); h = isNaN(h) ? st.H : clamp(Math.round(h), 1000, 60000);
    if (w === st.W && h === st.H){ renderMeta(); return; }
    mutate(function(){ st.W = w; st.H = h; }); fitView();
  });
});
$('#h-sf').addEventListener('change', function(e){ var v = e.target.value.trim(); mutate(function(){ st.sf = v; }); });
$('#h-sub').addEventListener('change', function(e){ var v = e.target.value.trim(); mutate(function(){ st.sub = v; }); });
$('#h-est').addEventListener('click', function(){
  var a = parseFloat($('#h-sf').value);
  if (isNaN(a) || a < 100){ live('Isi luas dalam sq ft dahulu, kemudian tekan Anggar.'); return; }
  mutate(function(){ st.sf = String(Math.round(a)); st.W = clamp(snap(Math.sqrt(a * SQFT * 1.25)), 1000, 60000); st.H = clamp(snap(a * SQFT / st.W), 1000, 60000); });
  fitView();
});
$('#h-walls').addEventListener('click', function(){ mutate(perimeter); });
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  var mod = e.metaKey || e.ctrlKey, k = e.key;
  if (mod && k.toLowerCase() === 'z'){ e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if (k === 'Escape'){ setTool('select'); sel = null; renderAll(); return; }
  var g = get(sel); if (!g) return;
  if (k === 'Delete' || k === 'Backspace'){ e.preventDefault(); removeSel(); return; }
  if (k.toLowerCase() === 'r'){ rotSel(); return; }
  var step = e.shiftKey ? 500 : 50, dx = 0, dy = 0;
  if (k === 'ArrowLeft') dx = -step; else if (k === 'ArrowRight') dx = step; else if (k === 'ArrowUp') dy = -step; else if (k === 'ArrowDown') dy = step; else return;
  e.preventDefault();
  mutate(function(){
    var o = g.o;
    if (g.k === 'walls'){ o.x1 += dx; o.x2 += dx; o.y1 += dy; o.y2 += dy; }
    else if (g.k === 'ops'){ o.pos += dx + dy; fitOp(o); }
    else { o.x += dx; o.y += dy; }
  });
});
if (window.ResizeObserver) new ResizeObserver(function(){ if (drag) return; if (fitted) fitView(); else renderCanvas(); }).observe(sheet);

/* ---------- start ---------- */
renderPalette(); setTool('select'); refreshPlans();
var d0 = null;
try{ d0 = JSON.parse(localStorage.getItem('eden-fp2-draft') || 'null'); }catch(_){}
if (d0 && d0.st && Array.isArray(d0.st.walls)) load(d0.st, d0.planId); else load(sample());
})();
