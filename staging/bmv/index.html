<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Blacklist/Subsales Control Room</title>
<meta name="description" content="Rumah highrise below market value: nilai pasaran dari senarai lelong, dibandingkan dengan iklan subsales owner dan ejen. Laman peribadi Firdaus Jay.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M14 46V22l18-10 18 10v24H38V34H26v12z' fill='%23f59e0b'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#0f172a;--mute:#5b6473;--line:#e3e6eb;--brand:#0f172a;--gold:#b45309;--gold-bg:#fff7e6;--green:#15803d;--green-bg:#ecfdf3;--red:#b91c1c;--red-bg:#fef2f2;--blue:#1d4ed8;--blue-bg:#eff6ff;--chip:#eef1f5;--sh:0 1px 2px rgba(15,23,42,.06),0 6px 20px -12px rgba(15,23,42,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141a2c;--ink:#e8ecf4;--mute:#9aa4b8;--line:#263049;--brand:#e8ecf4;--gold:#fbbf24;--gold-bg:#2a2008;--green:#4ade80;--green-bg:#0c2a18;--red:#f87171;--red-bg:#2e1111;--blue:#93c5fd;--blue-bg:#0f1f3d;--chip:#1e2740;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141a2c;--ink:#e8ecf4;--mute:#9aa4b8;--line:#263049;--brand:#e8ecf4;--gold:#fbbf24;--gold-bg:#2a2008;--green:#4ade80;--green-bg:#0c2a18;--red:#f87171;--red-bg:#2e1111;--blue:#93c5fd;--blue-bg:#0f1f3d;--chip:#1e2740;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
a{color:var(--blue)}button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;min-height:56px;padding-top:6px;padding-bottom:6px}
h1{font-size:17px;margin:0;line-height:1.2}h1 small{display:block;font-size:11px;color:var(--mute);font-weight:500}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.ic:hover{background:var(--chip)}
.grow{flex:1}
/* gate */
#gate{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:var(--sh)}
#gate h2{margin:0 0 4px;font-size:20px}#gate p{color:var(--mute);margin:0 0 16px;font-size:14px}
#code{width:100%;font-size:20px;letter-spacing:.14em;text-transform:uppercase;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--brand);color:var(--bg)}
.btn.w{width:100%;margin-top:12px}.btn.s{padding:7px 12px;font-size:13px;border-radius:10px}.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.5;cursor:default}
#gmsg{min-height:20px;font-size:13px;color:var(--red);margin-top:10px;text-align:center}
/* tabs + stats */
.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.tab.on{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:20px;line-height:1.1}.st span{font-size:12px;color:var(--mute)}
/* filters */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters label{font-size:11px;color:var(--mute);display:block;margin-bottom:2px}
.filters select,.filters input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.filters .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--mute)}
/* cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;cursor:pointer}
.card .ph{aspect-ratio:2/1;background:linear-gradient(135deg,#1e293b,#334155);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .nf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:12px}
.card .ph .tag{position:absolute;left:10px;top:10px;background:rgba(15,23,42,.85);color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:600}
.card .ph .lead{position:absolute;right:10px;top:10px;background:var(--green);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{margin:0;font-size:16px;line-height:1.25}.card .sub{font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border-radius:7px;padding:2px 7px;font-size:11.5px;color:var(--ink)}
.chip.g{background:var(--gold-bg);color:var(--gold)}.chip.gr{background:var(--green-bg);color:var(--green)}.chip.r{background:var(--red-bg);color:var(--red)}.chip.b{background:var(--blue-bg);color:var(--blue)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.kv div span{display:block;font-size:11px;color:var(--mute)}
.kv b{font-weight:600}
.money{font-variant-numeric:tabular-nums}
.gap{font-weight:700}.gap.pos{color:var(--green)}.gap.neg{color:var(--red)}
.card .ft{display:flex;gap:6px;margin-top:auto;padding-top:4px}
/* cashback box */
.cash{grid-column:1/-1;border-radius:12px;padding:10px 12px;background:var(--green-bg);border:1px solid var(--green);font-size:13px}
.cash.no{background:var(--red-bg);border-color:var(--red)}.cash.na{background:var(--chip);border-color:var(--line)}
.cash h5{margin:0 0 6px;font-size:13px}
.cash .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.cash .ln span{color:var(--mute)}
.cash .tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-size:16px;font-weight:800}
.cash.no .tot{color:var(--red)}.cash:not(.no):not(.na) .tot{color:var(--green)}
.cash .how{font-size:11.5px;color:var(--mute);margin-top:6px}
.cashchip{background:var(--green);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
/* detail sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .pan{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:var(--bg);overflow:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.sec h4 .n{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
.ad{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--bg)}
.ad.own{border-color:var(--green)}
.ad .p{font-size:17px;font-weight:700}.ad .m{font-size:12px;color:var(--mute)}
.ad .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ad select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);color:var(--ink);font-size:12px}
.src{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.hero{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* control room */
.cr input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.cr .cd{font:600 14px ui-monospace,Consolas,monospace;letter-spacing:.06em;white-space:nowrap;display:inline-block;margin:0 4px 4px 0}
.cr .cdc{min-width:150px}.cr .cdc .btn{margin-bottom:4px}
.cr .big{font-size:22px;letter-spacing:.12em;font-weight:700;text-align:center;padding:12px;border:1.5px dashed var(--gold);border-radius:12px;background:var(--gold-bg);color:var(--gold);margin:8px 0}
.ok{color:var(--green)}.err{color:var(--red)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--brand);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:480px){.list{grid-template-columns:1fr}#sheet .pan{padding:12px}h1 small{display:none}}
/* ---- easy view (22/11/2026): big tiles, one-tap filters, advert cards ---- */
body{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;color:var(--ink);box-shadow:var(--sh)}
.tile:hover{border-color:var(--ink)}
.tile b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}.tile span{font-size:13px;color:var(--mute)}
.tile.t1 b{color:var(--green)}.tile.t2 b{color:var(--gold)}
.tabs .tab{font-size:15px;padding:10px 18px;min-height:44px}
.fbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:6px;display:flex;flex-direction:column;gap:10px}
.srch{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.srch:focus-within{border-color:var(--blue)}
.srch input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:12px 0;outline:0}
.srch button{border:0;background:var(--chip);color:var(--ink);border-radius:999px;width:30px;height:30px;font-weight:700}
.quick,.seg{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px;white-space:nowrap}
.pill:hover{border-color:var(--ink)}
.pill small{font-weight:500;color:var(--mute);margin-left:2px}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}.pill.on small{color:#fff}
:root[data-theme="dark"] .pill.on,:root[data-theme="dark"] .pill.on small{color:#04130a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.on,:root:not([data-theme="light"]) .pill.on small{color:#04130a}}
.pill.zero{opacity:.45}
.gl{font-size:13px;font-weight:700;margin-bottom:5px}
.segs{display:flex;flex-wrap:wrap;gap:10px 28px}
.fbody{display:flex;flex-direction:column;gap:10px}
.selrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.selrow label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
.selrow select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;min-height:44px}
.selrow select.set{border-color:var(--green);background:var(--green-bg)}
details.adv summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0;color:var(--blue)}
details.adv .selrow{margin-top:6px}
#fToggle{display:none}
.rbar{position:sticky;top:var(--hh,56px);z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.rbar #count{font-size:17px;font-weight:500}.rbar #count b{font-size:20px}
.act{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.apill{border:0;background:var(--green-bg);color:var(--green);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.apill:hover{background:var(--red-bg);color:var(--red)}
.list.ads{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.adc{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.adc.own{border:2px solid var(--green)}
.adc .top{display:flex;gap:10px;align-items:flex-start}
.adc .th{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none}
.adc h3{margin:0;font-size:17px;line-height:1.25;cursor:pointer}.adc h3:hover{text-decoration:underline}
.adc .sub{font-size:13px;color:var(--mute)}
.star{background:var(--gold-bg);color:var(--gold);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800;white-space:nowrap}
.cbig{background:var(--green-bg);border-radius:12px;padding:10px 12px}
.cbig span,.cbig small{font-size:12px;color:var(--mute);display:block}
.cbig b{font-size:27px;color:var(--green);line-height:1.2;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two span{font-size:12px;color:var(--mute);display:block}.two b{font-size:16px}
.ttl{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adc .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:2px}
.adc select{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--card);color:var(--ink);font-size:13px}
.adc .chip{font-size:12.5px;padding:3px 8px}
.empty b{display:block;font-size:40px;margin-bottom:6px}.empty p{margin:0 0 12px}
.morew{text-align:center;margin:18px 0}
#top{position:fixed;right:16px;bottom:16px;z-index:6;width:46px;height:46px;border-radius:999px;border:0;background:var(--brand);color:var(--bg);font-size:20px;font-weight:700;box-shadow:var(--sh);display:none}
#top.on{display:block}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}.tile b{font-size:24px}
 #fToggle{display:flex}.fbody{display:none}.fbox.open .fbody{display:flex}
 .quick{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px;padding:0 12px 2px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
 .act{flex-wrap:nowrap;overflow-x:auto;flex-basis:100%;order:3;scrollbar-width:none}.list.ads{grid-template-columns:1fr}
 header h1{font-size:15px}}
</style>
</head>
<body>
<div style="position:fixed;left:8px;bottom:8px;z-index:9999;background:#c62828;color:#fff;font:700 12px/1 system-ui,sans-serif;padding:6px 10px;border-radius:999px;pointer-events:none">STAGING · ujian, bukan laman live</div>
<header><div class="wrap">
 <h1>Blacklist/Subsales Control Room<small data-i18n="title_sub"></small></h1>
 <div class="grow"></div>
 <button class="ic" id="lang" title="Bahasa / Language">EN</button>
 <button class="ic" id="theme" title="Light / Dark">◐</button>
 <button class="ic" id="lock" data-i18n="logout" hidden></button>
</div></header>

<main class="wrap">
 <section id="gate">
  <h2 data-i18n="gate_h"></h2>
  <p data-i18n="gate_p"></p>
  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="BMV-XXXX-XXXX" data-i18n-al="gate_h">
  <button class="btn w" id="open" data-i18n="gate_btn"></button>
  <div id="gmsg" role="status"></div>
 </section>

 <section id="app" hidden>
  <div class="tiles" id="tiles"></div>
  <p class="note" id="upd" style="margin:0 0 4px"></p>
  <div class="tabs" role="tablist">
   <button class="tab on" data-t="ads" role="tab" data-i18n="tab_ads"></button>
   <button class="tab" data-t="bld" role="tab" data-i18n="tab_bld"></button>
   <button class="tab" data-t="cr" role="tab" id="crTab" hidden>Control Room</button>
  </div>

  <div id="vList">
   <div class="fbox" id="fbox">
    <div class="srch"><span aria-hidden="true">🔍</span><input id="q" type="search" autocomplete="off" data-i18n-ph="q_ph" data-i18n-al="q_ph"><button id="qx" hidden aria-label="clear">✕</button></div>
    <div class="quick" id="quick"></div>
    <button class="btn o s" id="fToggle"></button>
    <div class="fbody" id="filters">
     <div class="segs">
      <div><div class="gl" data-i18n="g_cash"></div><div class="seg" data-f="cash"></div></div>
      <div><div class="gl" data-i18n="g_beds"></div><div class="seg" data-f="beds"></div></div>
      <div><div class="gl" data-i18n="g_price"></div><div class="seg" data-f="price"></div></div>
     </div>
     <div class="selrow">
      <div><label for="fState" data-i18n="f_state"></label><select id="fState"></select></div>
      <div><label for="fDist" data-i18n="f_dist"></label><select id="fDist"></select></div>
      <div id="sortAW"><label for="sortA" data-i18n="f_sort"></label><select id="sortA"><option value="net" data-i18n="sa_net"></option><option value="cheap" data-i18n="sa_cheap"></option><option value="new" data-i18n="sa_new"></option><option value="psf" data-i18n="sa_psf"></option></select></div>
      <div id="sortBW" hidden><label for="sortB" data-i18n="f_sort"></label><select id="sortB"><option value="cash" data-i18n="sort_cash"></option><option value="name" data-i18n="sort_name"></option><option value="year" data-i18n="sort_year"></option><option value="mvn" data-i18n="sort_mvn"></option><option value="cheap" data-i18n="sort_cheap"></option></select></div>
     </div>
     <details class="adv" id="adv"><summary data-i18n="more"></summary>
      <div class="selrow">
       <div><label for="fSrc" data-i18n="f_src"></label><select id="fSrc"><option value="" data-i18n="all"></option><option value="mudah">Mudah</option><option value="propertyguru">PropertyGuru</option><option value="iproperty">iProperty</option></select></div>
       <div><label for="fKind" data-i18n="f_kind"></label><select id="fKind"><option value="" data-i18n="all"></option><option>Apartment</option><option>Condominium</option><option>Serviced Apartment</option></select></div>
       <div><label for="fTen" data-i18n="f_ten"></label><select id="fTen"><option value="" data-i18n="all"></option><option>Freehold</option><option>Leasehold</option></select></div>
       <div><label for="fLaca">LACA</label><select id="fLaca"><option value="" data-i18n="all"></option><option value="LACA" data-i18n="laca_has"></option><option value="Non-LACA" data-i18n="nonlaca_has"></option></select></div>
       <div><label for="fBank">Bank</label><select id="fBank"></select></div>
       <div><label for="fYear" data-i18n="f_year"></label><select id="fYear"></select></div>
       <div><label for="fAuc" data-i18n="f_auc"></label><select id="fAuc"><option value="" data-i18n="all"></option><option value="any" data-i18n="auc_any"></option><option value="30" data-i18n="auc_30"></option></select></div>
       <div><label for="fStatus" data-i18n="f_status"></label><select id="fStatus"></select></div>
       <div id="fSubW" hidden><label for="fSub" data-i18n="f_sub"></label><select id="fSub"><option value="" data-i18n="all"></option><option value="any" data-i18n="sub_any"></option><option value="none" data-i18n="sub_none"></option></select></div>
      </div>
     </details>

let ACCESS=null,DATA=null,KRAW=null,ARAW=null,ADMIN=false,ENTRY=null,CODE='';
async function derive(code){const n=norm(code);const cache=ls.get('bmv.kdk');
 if(cache&&cache.n===n&&cache.salt===ACCESS.kdf.salt&&cache.iter===ACCESS.kdf.iter)return b64(cache.bits);
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(n),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(ACCESS.kdf.salt),iterations:ACCESS.kdf.iter},base,256));
 ls.set('bmv.kdk',{n,salt:ACCESS.kdf.salt,iter:ACCESS.kdf.iter,bits:tob64(bits)});return bits}
async function idOf(bits){const tag=new Uint8Array([...bits,...new TextEncoder().encode('lelong-id')]);return hex(await crypto.subtle.digest('SHA-256',tag)).slice(0,32)}
async function unlock(code){
 if(!ACCESS){try{ACCESS=await fetch('access.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null)}catch(e){ACCESS=null}}
 if(!ACCESS)return {err:t('err_access')};
 const bits=await derive(code);const id=await idOf(bits);const e=ACCESS.codes[id];
 if(!e)return {err:t('err_invalid')};
 if(!e.wk||(e.exp&&new Date(e.exp)<new Date()))return {err:t('err_expired',{d:(e.exp||'').slice(0,10)})};
 try{const wk=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  KRAW=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},wk,b64(e.wk));
  ARAW=null;if(e.admin&&e.wk2){try{ARAW=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv2)},wk,b64(e.wk2))}catch(x){ARAW=null}}
 }catch(x){return {err:t('err_invalid')}}
 ADMIN=!!(e.admin&&ARAW);ENTRY=e;CODE=code;return {ok:true}}
async function loadData(){
 const env=await fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());
 if(env.kid!==ACCESS.kid){ACCESS=await fetch('access.json?v='+Date.now()+'r',{cache:'no-store'}).then(r=>r.json());const r=await unlock(CODE);if(r.err)throw new Error(r.err)}
 const key=await crypto.subtle.importKey('raw',KRAW,'AES-GCM',false,['decrypt']);
 DATA=JSON.parse(await gunzip(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(env.iv)},key,b64(env.ct))))}

const PRICE_BANDS={a:[0,300000],b:[300000,500000],c:[500000,1000000],d:[1000000,Infinity]};   // asking price: from (included) up to (not included)
const F0=()=>({q:'',lead:false,owner:false,phone:false,ver:false,strong:false,fresh:false,cash:0,price:'',beds:'',state:'',dist:'',src:'',kind:'',tenure:'',laca:'',bank:'',year:0,auc:'',status:'',sub:''});
const AD_KEYS=['lead','owner','phone','ver','fresh','cash','price','beds','src','status'];   // filters that look at one advert; the rest look at its building
const activeKeys=F=>Object.keys(F0()).filter(k=>F[k]);
const netOf=l=>l.net!=null?l.net:l.est_mv==null?null:Math.round(l.est_mv*0.9)-l.price-Math.round(l.price*0.04);   // the same sum as bmv_subsales.net_cash
const uidOf=(l,b)=>l.url||(b.key+'|'+l.price);
const ySort=b=>b.year_sort??b.completion_year??9999;
const addDays=(iso,n)=>new Date(Date.parse(iso+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const nextAuction=(b,today)=>(b.units||[]).reduce((m,u)=>u.src==='active'&&u.auction_date&&u.auction_date>=today&&(m==null||u.auction_date<m)?u.auction_date:m,null);
const hay=b=>b._hay||(b._hay=[b.name,b.area,b.street,b.district,b.state,b.postcode,(b.banks||[]).join(' ')].filter(Boolean).join(' ').toLowerCase());
const qMatch=(text,q)=>{const w=(q||'').toLowerCase().split(/\s+/).filter(Boolean);return w.every(x=>text.includes(x))};   // every word typed must be there
function bldMatch(b,F,ctx){
 if(F.state&&b.state!==F.state)return false;if(F.dist&&b.district!==F.dist)return false;
 if(F.kind&&b.kind!==F.kind)return false;if(F.tenure&&b.tenure!==F.tenure)return false;
 if(F.laca&&!(b.laca||{})[F.laca])return false;if(F.bank&&!(b.banks||[]).includes(F.bank))return false;
 if(F.year&&ySort(b)>F.year)return false;
 if(F.strong&&!(b.mv&&b.mv.n>=2))return false;   // market value seen on two auction units or more
 if(F.auc){const n=nextAuction(b,ctx.today);if(!n)return false;if(F.auc!=='any'&&n>addDays(ctx.today,+F.auc))return false}
 return true}
function adMatch(l,b,F,ctx){
 if(F.lead&&!l.lead)return false;if(F.owner&&l.seller!=='owner')return false;if(F.phone&&!l.phone)return false;
 if(F.ver&&l.verified!=='confirmed'&&l.verified!=='corrected')return false;   // opened one by one and still for sale
 if(F.fresh&&!(ctx.month&&String(l.listed||'').slice(0,7)===ctx.month))return false;
 if(F.cash){const n=netOf(l);if(n==null||n<F.cash)return false}
 if(F.price){const [a,z]=PRICE_BANDS[F.price];if(!(l.price>=a&&l.price<z))return false}
 if(F.beds){const n=l.bedroom;if(n==null)return false;if(F.beds==='1'?n>1:F.beds==='4'?n<4:n!==+F.beds)return false}   // '1' = studio or one room, '4' = four or more
 if(F.src&&l.src!==F.src&&!(l.also||[]).includes(F.src))return false;
 if(F.status&&(ctx.status?ctx.status(uidOf(l,b)):'Baru')!==F.status)return false;
 return true}
function filterAds(B,F,ctx){const out=[];for(const b of B){if(!bldMatch(b,F,ctx))continue;const h=hay(b);
  for(const l of b.sub.listings)if(adMatch(l,b,F,ctx)&&qMatch(h+' '+String(l.title||'').toLowerCase(),F.q))out.push({b,l})}return out}
function filterBlds(B,F,ctx){const adf=AD_KEYS.some(k=>F[k]);
 return B.filter(b=>{if(!bldMatch(b,F,ctx)||!qMatch(hay(b),F.q))return false;
  if(F.sub==='any'&&!b.sub.n)return false;if(F.sub==='none'&&b.sub.checked)return false;
  return !adf||b.sub.listings.some(l=>adMatch(l,b,F,ctx))})}   // an advert filter keeps the buildings that have such an advert
const bestCash=b=>b.sub.listings.reduce((m,l)=>l.cashout90!=null&&(m==null||l.cashout90>m)?l.cashout90:m,null);
function sortAds(rows,s){const n=r=>netOf(r.l)??-1e12,psf=r=>r.l.built_up?r.l.price/r.l.built_up:1e12;
 return rows.sort((x,y)=>s==='cheap'?x.l.price-y.l.price||n(y)-n(x):s==='new'?String(y.l.listed||'').localeCompare(String(x.l.listed||''))||n(y)-n(x):s==='psf'?psf(x)-psf(y)||n(y)-n(x):n(y)-n(x)||x.l.price-y.l.price)}
function sortBlds(rows,s){const c=b=>bestCash(b)??-1e12;
 return rows.sort((a,b)=>s==='name'?a.name.localeCompare(b.name):s==='year'?ySort(a)-ySort(b)||a.name.localeCompare(b.name):s==='mvn'?b.mv.n-a.mv.n||c(b)-c(a):s==='cheap'?((a.sub.price_range?.[0]??1e12)-(b.sub.price_range?.[0]??1e12))||a.name.localeCompare(b.name):c(b)-c(a)||b.mv.n-a.mv.n||a.name.localeCompare(b.name))}

async function makeCode(){const name=$('#nName').value.trim();if(!name){toast(t('need_name'));return}const days=+$('#nDays').value||0;
 const code=newCode();const n=norm(code);const a=curAccess();
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(n),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(a.kdf.salt),iterations:a.kdf.iter},base,256));
 const id=await idOf(bits);const wk=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
 const wrapped=await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,KRAW);
 const exp=days?new Date(Date.now()+days*864e5):null;if(exp)exp.setHours(23,59,59,0);
 const n0=Object.keys(a.codes).length+1;const initials=name.split(/\s+/).map(w=>w[0]).filter(c=>/[a-z]/i.test(c)).join('').slice(0,3).toUpperCase()||'C';
 const entry={label:initials+String(n0).padStart(2,'0'),name,exp:exp?exp.toISOString():null,iv:tob64(iv),wk:tob64(wrapped)};
 // the code itself, sealed with the admin key so bmv_codes.py sync can re-wrap it after a key rotation
 const ak=await crypto.subtle.importKey('raw',ARAW,'AES-GCM',false,['encrypt']);const iv2=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv2},ak,new TextEncoder().encode(JSON.stringify({code,label:entry.label,name,exp:entry.exp,created:new Date().toISOString()})));
 PENDING=PENDING||JSON.parse(JSON.stringify(ACCESS));PENDING.codes[id]=entry;PENDING.vault=PENDING.vault||{};PENDING.vault[id]={iv:tob64(iv2),ct:tob64(ct)};VCODES[id]=code;
 $('#newCode').hidden=false;$('#newCodeTxt').textContent=code;$('#nName').value='';$('#nDays').value='';codesTable();pend();
 navigator.clipboard?.writeText(code).then(()=>toast(t('copied_code')),()=>{})}
function download(){const a=curAccess();const blob=new Blob([JSON.stringify(a,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='access.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
 $('#pubMsg').innerHTML=t('dl_done')}
async function publish(){const tok=$('#ghTok').value.trim();if(!tok){$('#pubMsg').innerHTML='<span class="err">'+t('need_tok')+'</span>';return}
 if(!PENDING){$('#pubMsg').textContent=t('no_changes');return}
 const api=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.path}`;const h={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 $('#pubMsg').textContent=t('publishing');$('#pub').disabled=true;
 try{const cur=await fetch(api+'?ref=main',{headers:h});if(!cur.ok)throw new Error(t('gh_err',{s:cur.status}));const sha=(await cur.json()).sha;
  const out={...PENDING,updated:new Date().toISOString().slice(0,10)};
  const body={message:t('commit_msg'),content:btoa(unescape(encodeURIComponent(JSON.stringify(out,null,1)))),sha,branch:'main'};
  const r=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('GitHub '+r.status+': '+((await r.json()).message||''));
  ACCESS=out;PENDING=null;pend();codesTable();$('#pubMsg').innerHTML=t('pub_ok')}
 catch(e){$('#pubMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'+t('pub_fail_tail')}
 $('#pub').disabled=false}
</script>
</body>
